<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>今日任务</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- 顶部栏 -->
    <header class="header">
      <div class="header-left">
        <div class="logo-dot"></div>
        <h1 class="title">今日任务</h1>
        <span class="date-tag" id="dateTag"></span>
      </div>
      <div class="header-right">
        <span class="task-count" id="taskCount">0 项</span>
        <button id="pinBtn" class="pin-btn" title="固定在桌面最上层">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="17" x2="12" y2="22"></line>
            <path d="M5 17h14l-2-5V7l-5-3-5 3v5l-2 5z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- 输入区域 -->
    <div class="input-section">
      <div class="input-wrapper">
        <textarea
          id="taskInput"
          class="task-input"
          placeholder="每行一个任务，Enter 添加，Shift+Enter 换行..."
          rows="3"
          maxlength="2000"
          autocomplete="off"
          spellcheck="false"
        ></textarea>
        <button id="addBtn" class="add-btn" title="添加任务（Enter）">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>
      <div class="input-hint">换行分隔多个任务 · <kbd>Enter</kbd> 添加 · <kbd>Shift</kbd>+<kbd>Enter</kbd> 换行</div>
    </div>

    <!-- 任务列表 -->
    <ul id="taskList" class="task-list"></ul>

    <!-- 空状态 -->
    <div id="emptyState" class="empty-state">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 11l3 3L22 4"></path>
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
        </svg>
      </div>
      <p class="empty-text">还没有任务，开始添加吧 ~</p>
    </div>

    <!-- 底部提示 -->
    <footer class="footer">
      <span class="footer-tip">任务自动保存本地 · 7 天后过期清除</span>
      <button id="clearDoneBtn" class="clear-done-btn" title="清除已完成任务">清除已完成</button>
    </footer>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
