<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>今日任务</title>
  <script>
    (function () {
      var h = new Date().getHours();
      // 19:00–04:00 夜间，其余白天
      var theme = (h >= 19 || h < 4) ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 启动加载页：检测版本 / 下载更新 -->
  <div id="bootSplash" class="boot-splash">
    <div class="boot-splash-inner">
      <div class="boot-logo-dot"></div>
      <h1 class="boot-title">今日任务</h1>
      <p id="bootVersion" class="boot-version"></p>
      <div class="boot-spinner" aria-hidden="true"></div>
      <p id="bootStatus" class="boot-status">正在检查更新…</p>
      <div id="bootProgressTrack" class="boot-progress-track" hidden>
        <div id="bootProgressBar" class="boot-progress-bar"></div>
      </div>
      <p id="bootHint" class="boot-hint"></p>
    </div>
  </div>

  <div id="appRoot" class="app" hidden>
    <!-- 顶部栏 -->
    <header class="header">
      <div class="header-left">
        <div class="logo-dot"></div>
        <h1 class="title">今日任务</h1>
        <span class="date-tag" id="dateTag"></span>
      </div>
      <div class="header-right">
        <span class="task-count" id="taskCount">0 项</span>
        <div class="settings-wrap">
          <button id="settingsBtn" class="pin-btn" type="button" title="设置" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>
          <div id="settingsPanel" class="settings-panel" hidden>
            <div class="settings-section-label">外观</div>
            <div class="theme-tabs" role="tablist" aria-label="外观模式">
              <button type="button" class="theme-tab" data-theme="light" role="tab">白天模式</button>
              <button type="button" class="theme-tab" data-theme="dark" role="tab">夜间模式</button>
            </div>
          </div>
        </div>
        <button id="pinBtn" class="pin-btn" title="固定在桌面最上层">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="17" x2="12" y2="22"></line>
            <path d="M5 17h14l-2-5V7l-5-3-5 3v5l-2 5z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- 输入区域 -->
    <div class="input-section">
      <div class="input-wrapper">
        <textarea
          id="taskInput"
          class="task-input"
          placeholder="每行一个任务，Enter 添加，Shift+Enter 换行..."
          rows="3"
          maxlength="2000"
          autocomplete="off"
          spellcheck="false"
        ></textarea>
        <button id="addBtn" class="add-btn" title="添加任务（Enter）">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>
      <div class="input-hint">换行分隔多个任务 · <kbd>Enter</kbd> 添加 · <kbd>Shift</kbd>+<kbd>Enter</kbd> 换行</div>
      <div class="tag-bar" id="tagBar" title="点击选择标签 · 长按拖动排序"></div>
    </div>

    <!-- 任务列表（按标签分组） -->
    <div id="taskList" class="task-list"></div>

    <!-- 空状态 -->
    <div id="emptyState" class="empty-state">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 11l3 3L22 4"></path>
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
        </svg>
      </div>
      <p class="empty-text">还没有任务，开始添加吧 ~</p>
    </div>

    <!-- 底部提示 -->
    <footer class="footer">
      <span class="footer-tip">双击编辑 · 标签分类 · 长按拖排</span>
      <button id="clearDoneBtn" class="clear-done-btn" title="清除已完成任务">清除已完成</button>
    </footer>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
